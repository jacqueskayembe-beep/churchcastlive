<!doctype html>
<html><body>
<p id="s">idle</p>
<script>
// Dev-only harness (requires DEV_NO_AUTH=1): streams the default mic to /broadcast.
async function go(session, langs) {
  const ctx = new AudioContext({ sampleRate: 24000 });
  await ctx.audioWorklet.addModule("/capture-worklet.js");
  const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
  const node = new AudioWorkletNode(ctx, "capture-processor");
  ctx.createMediaStreamSource(stream).connect(node);
  const ws = new WebSocket(`ws://${location.host}/broadcast?session=${session}&langs=${langs}&source=en`);
  ws.binaryType = "arraybuffer";
  window.events = [];
  ws.onmessage = (e) => { const m = JSON.parse(e.data); window.events.push(m); document.getElementById("s").textContent = m.type; };
  node.port.onmessage = (e) => { if (ws.readyState === 1) ws.send(e.data); };
}
window.go = go;
</script>
</body></html>
